# 验证流水线配置文件示例
# Validation Pipeline Configuration Example
#
# 此文件展示了验证流水线的所有可配置选项
# This file demonstrates all configurable options for the validation pipeline

# ============================================================================
# 模型配置 (Model Configuration)
# ============================================================================
model:
  # 训练模型的路径 (相对于项目根目录)
  # Path to the trained model (relative to project root)
  # 必需字段 (Required)
  path: "model/20260318_212021_full_training_best"

# ============================================================================
# 验证配置 (Validation Configuration)
# ============================================================================
validation:
  # 验证回合数 - 运行多少轮验证
  # Number of validation episodes to run
  # 必需字段 (Required)
  num_episodes: 10
  
  # 每回合最大步数 - 防止无限循环
  # Maximum steps per episode - prevents infinite loops
  # 默认值: 150 (Default: 150)
  max_steps: 150
  
  # 帧保存间隔 - 每隔多少步保存一帧图片
  # Frame save interval - save one frame every N steps
  # 默认值: 5 (Default: 5)
  # 提示: 较小的值会生成更多图片和更流畅的视频，但占用更多磁盘空间
  # Tip: Smaller values generate more images and smoother videos but use more disk space
  save_frame_interval: 5

# ============================================================================
# 环境配置 (Environment Configuration)
# ============================================================================
environment:
  # Hunter (追击者) 数量
  # Number of hunters (pursuers)
  # 默认值: 6 (Default: 6)
  num_hunters: 6
  
  # Target (逃逸者) 数量
  # Number of targets (evaders)
  # 默认值: 2 (Default: 2)
  num_targets: 2
  
  # 障碍物数量
  # Number of obstacles
  # 默认值: 5 (Default: 5)
  num_obstacles: 5
  
  # 环境边长 (立方体环境的边长)
  # Environment size (side length of cubic environment)
  # 默认值: 2.0 (Default: 2.0)
  env_length: 2.0

# ============================================================================
# 随机种子 (Random Seed)
# ============================================================================
# 用于确保验证结果的可重复性
# Used to ensure reproducibility of validation results
# 默认值: 42 (Default: 42)
random_seed: 42

# ============================================================================
# 输出配置 (Output Configuration)
# ============================================================================
output:
  # 是否保存图片
  # Whether to save images
  # 默认值: true (Default: true)
  save_images: true
  
  # 是否生成视频
  # Whether to generate videos
  # 默认值: true (Default: true)
  save_video: true
  
  # 是否保存日志
  # Whether to save logs
  # 默认值: true (Default: true)
  save_logs: true
  
  # 视频帧率 (FPS)
  # Video frame rate (FPS)
  # 默认值: 10 (Default: 10)
  # 提示: 较高的FPS会使视频更流畅，但文件更大
  # Tip: Higher FPS makes smoother videos but larger files
  video_fps: 10

# ============================================================================
# 使用说明 (Usage Instructions)
# ============================================================================
# 1. 复制此文件并重命名为你的配置文件，例如: my_validation.yaml
#    Copy this file and rename it to your config file, e.g.: my_validation.yaml
#
# 2. 修改配置参数以适应你的需求
#    Modify the configuration parameters to suit your needs
#
# 3. 运行验证流水线:
#    Run the validation pipeline:
#    python -c "from src.validation_pipeline import ValidationPipeline; pipeline = ValidationPipeline('my_validation.yaml'); pipeline.run_validation()"
#
# 4. 查看输出结果在 output/{timestamp}_validation/ 目录
#    View output results in output/{timestamp}_validation/ directory
#
# ============================================================================
# 配置示例 (Configuration Examples)
# ============================================================================
#
# 快速测试配置 (Quick Test Configuration):
# ---
# model:
#   path: "model/your_model"
# validation:
#   num_episodes: 3
#   max_steps: 100
#   save_frame_interval: 10
# random_seed: 42
#
# 高质量视频配置 (High Quality Video Configuration):
# ---
# model:
#   path: "model/your_model"
# validation:
#   num_episodes: 10
#   max_steps: 200
#   save_frame_interval: 2
# output:
#   video_fps: 30
# random_seed: 42
#
# 大规模验证配置 (Large Scale Validation Configuration):
# ---
# model:
#   path: "model/your_model"
# validation:
#   num_episodes: 50
#   max_steps: 150
#   save_frame_interval: 5
# environment:
#   num_hunters: 8
#   num_targets: 3
#   num_obstacles: 10
# random_seed: 42
